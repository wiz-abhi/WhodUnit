# Foundry Installation for the Whodunit demo stack.
#
# `foundryctl forge -f deploy/casting.yaml` generates the compose bundle
# (files only). NEVER run `cast`/`deploy` here: a live SigNoz stack already
# occupies :8080 and :4318 on this machine.
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  mcp:
    spec:
      enabled: true
  # --- Whodunit corpus injection (lands in Wave 3) --------------------------
  # The seeded demo corpus emits OTLP traces+logs at volume so the miner has
  # real data to work on. It is injected as an extra compose service via an
  # RFC6902 JSON Patch. Uncomment once the corpus image is published.
  #
  # patches:
  #   - op: add
  #     path: /services/whodunit-corpus
  #     value:
  #       image: whodunit/corpus:latest
  #       environment:
  #         - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
  #         - WHODUNIT_SEED=1957
  #         - WHODUNIT_FAULT=conditional_dep
  #       depends_on:
  #         - otel-collector
