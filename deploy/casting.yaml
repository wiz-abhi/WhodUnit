# Foundry Installation for the Whodunit demo stack: SigNoz + its MCP server.
#
# On a CLEAN host, this IS the one-command install:
#     foundryctl cast -f deploy/casting.yaml
# On THIS machine only `forge` (generate the compose bundle, files only) is safe —
# a live SigNoz stack already occupies :8080 and :4318, so `cast`/`deploy` here
# would collide. The port note is about the author's box, not the file.
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  mcp:
    spec:
      enabled: true
  # --- Optional: bake the demo corpus into the stack (future work) ----------
  # NOT required to reproduce anything: the documented demo seeds the corpus
  # directly with `python -m corpus.generate --seed 778 --fault conditional_dep`
  # (see README Quickstart, step 2). This patch only matters if you want a
  # self-contained image that emits traffic on boot; publish whodunit/corpus:latest
  # first, then uncomment.
  #
  # patches:
  #   - op: add
  #     path: /services/whodunit-corpus
  #     value:
  #       image: whodunit/corpus:latest
  #       environment:
  #         - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
  #         - WHODUNIT_SEED=1957
  #         - WHODUNIT_FAULT=conditional_dep
  #       depends_on:
  #         - otel-collector
